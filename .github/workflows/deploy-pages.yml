name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_BASE_PATH: /investment-dao/
          VITE_DEMO_MODE: "true"
          VITE_CHAIN_ID: ${{ vars.VITE_CHAIN_ID }}
          VITE_DAO_ADDRESS: ${{ vars.VITE_DAO_ADDRESS }}
          VITE_TOKEN_ADDRESS: ${{ vars.VITE_TOKEN_ADDRESS }}
          VITE_SAFE_ADDRESS: ${{ vars.VITE_SAFE_ADDRESS }}
          VITE_QUARTERLY_REPORT_ADDRESS: ${{ vars.VITE_QUARTERLY_REPORT_ADDRESS }}
          VITE_SAFE_TX_SERVICE_URL: ${{ vars.VITE_SAFE_TX_SERVICE_URL }}
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
